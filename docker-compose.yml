services:
  api:
    build: ./api
    image: liman-api
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - models:/models
    restart: unless-stopped

  web:
    build: ./web
    image: liman-web
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  models:
