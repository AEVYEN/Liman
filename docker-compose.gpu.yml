services:
  api:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.8.1-runtime-ubuntu24.04
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
        LLAMA_CPP_INDEX: https://abetlen.github.io/llama-cpp-python/whl/cu124
    image: liman-api:gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
